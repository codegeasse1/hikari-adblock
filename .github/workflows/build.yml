name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with a signed APK'
        type: boolean
        default: false
      version:
        description: 'Release version (e.g. 1.0.0)'
        type: string
        default: '1.0.0'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee /tmp/test-output.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^e:\ ([^:]+):([0-9]+):([0-9]+):\ (.*)$ ]]; then
                f="${BASH_REMATCH[1]}"; f="${f#*/hikari-adblock/}"
                echo "::error file=${f},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]}::${BASH_REMATCH[4]}"
              fi
            done < <(grep -E '(^| )e: ' /tmp/test-output.log | head -10)
            echo "::error::Gradle build failed (exit ${rc}) — full log on branch ci-logs"
            exit $rc
          fi

      - name: Save test log on failure
        if: failure()
        run: |
          cp /tmp/test-output.log test-output.log
          git config user.name "hika-build"
          git config user.email "actions@github.com"
          git checkout --orphan ci-logs
          git add test-output.log
          git commit -m "test log $(date -u +%Y%m%d%H%M%S)" --allow-empty
          git push -f origin ci-logs || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-adblock-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hikari-adblock-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Publish signed release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -storepass "$KS_PASS" \
            -keypass "$KS_PASS" -alias hikari -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hikari AdBlock, O=codegeasse1, C=US"
          echo "RELEASE_KEYSTORE_B64=$(base64 -w0 release.jks)" >> "$GITHUB_ENV"
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'hikari-adblock-ci' }}

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          RELEASE_KEYSTORE_B64: ${{ env.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hikari-adblock-ci' }}
          RELEASE_KEY_ALIAS: hikari
          RELEASE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hikari-adblock-ci' }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Hikari AdBlock v${{ github.event.inputs.version }}
          body: |
            **Hikari AdBlock** — free, open-source, no-root Android ad blocker.

            - `app-release.apk` — release build (signed, installable)
            - `app-debug.apk` — debug build

            Built and signed automatically by GitHub Actions.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
